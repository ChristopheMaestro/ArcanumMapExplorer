<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcanum CE Restored - Map Explorer</title>
    <!-- Link to the clean external layout stylesheet file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Left Menu Sidebar -->
    <div id="sidebar">
        <div class="sidebar-header">
            <img src="Textures/Site-logo.png" alt="Arcanum Logo" class="sidebar-logo">
            - Map Explorer -
        </div>
        
        <!-- Three high-level selector buttons requested under the title -->
        <div class="mod-filter-nav">
            <div id="tab-arcanum" class="mod-filter-tab active-tab" onclick="switchModCategory('arcanum')">Arcanum</div>
            <div id="tab-cerestored" class="mod-filter-tab" onclick="switchModCategory('cerestored')">CE Restored</div>
            <div id="tab-modules" class="mod-filter-tab" onclick="switchModCategory('modules')">Modules</div>
        </div>

        <div id="menu-container">
            <!-- Items grouped by modifications load here dynamically -->
        </div>

        <!-- Creator Tool Input Deck Panel -->
        <div id="creator-panel">
            <h3>Label Placement Tool</h3>
            <div style="color:#d4c5a1; font-size:12px;">Click the map to set a spot: <strong id="coord-display">X: -, Y: -</strong></div>
            
            <label>Label Text</label>
            <input type="text" id="new-label-text" placeholder="e.g., Bates Factory">
            
            <label>Description Note</label>
            <textarea id="new-label-desc" placeholder="Historical information..."></textarea>

            <div id="master-fields" class="field-row" style="display:none;">
                <label>Master</label>
                <input type="text" id="new-label-master" placeholder="e.g., Master of Fire">
            </div>

            <div class="field-row">
                <label>Linked Label(s) - optional</label>
                <input type="text" id="new-label-links" placeholder="Exact text of other label(s), comma-separated">
            </div>

            <div id="category-field" class="field-row">
                <label>Category (pick one or more)</label>
                <div class="category-checkboxes">
                    <label><input type="checkbox" class="new-label-cat-chk" value="quest" checked> 📜 Quest</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="followers"> 🛡️ Followers</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="shop"> 🪙 Shop</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="waypoint"> 🚪 Waypoint</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="key"> 🔑 Key</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="npc"> 🧑 NPC</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="chest"> 📦 Chest</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="information"> ℹ️ Information</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="altar"> 🕯️ Altar</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="bounty"> 💰 Bounty</label>
                    <label><input type="checkbox" class="new-label-cat-chk" value="master"> 🎓 Master</label>
                </div>
            </div>

            <div id="waypoint-fields" class="waypoint-subfields" style="display:none;">
                <div class="field-row">
                    <label>Destination Map</label>
                    <select id="new-label-target-map">
                        <option value="">— choose a map —</option>
                    </select>
                </div>
                <div class="field-row">
                    <label>Arrival X (optional)</label>
                    <input type="number" id="new-label-target-x" placeholder="uses destination's default view if blank">
                </div>
                <div class="field-row">
                    <label>Arrival Y (optional)</label>
                    <input type="number" id="new-label-target-y" placeholder="uses destination's default view if blank">
                </div>
            </div>

            <div id="shop-fields" class="waypoint-subfields" style="display:none;">
                <div class="field-row">
                    <label>Shop Type</label>
                    <input type="text" id="new-label-shop-type" list="shop-type-options" placeholder="e.g., Blacksmith">
                    <datalist id="shop-type-options"></datalist>
                </div>
                <div class="field-row">
                    <label>Markup % (optional)</label>
                    <input type="number" id="new-label-shop-markup" placeholder="e.g., 150">
                </div>
            </div>

            <div id="editing-indicator" style="display:none;">✏️ Editing: <span id="editing-label-name"></span></div>
            
            <button id="add-to-preview-btn" class="toggle-btn" style="width:100%;">+ Add Label</button>
            <button id="cancel-edit-btn" class="toggle-btn" style="width:100%; display:none;">Cancel Edit</button>
            <div class="copy-actions">
                <button id="copy-all-btn" class="toggle-btn">📋 Copy All</button>
                <button id="copy-new-btn" class="toggle-btn">📋 Copy New</button>
            </div>
        </div>
    </div>

    <!-- Right Side Global Workspace Area -->
    <div id="main-viewer">
        <div id="control-bar">
            <button id="filterDropdownBtn" class="toggle-btn">Hide labels</button>
            
            <!-- Renamed button link element configuration -->
            <button id="toggleCreatorModeBtn" class="toggle-btn">Label Editor</button>
            <!-- Repositioned Hot-Reload button asset pinned to top utility navigation deck bar -->
            <button id="topBarReloadBtn" class="toggle-btn" onclick="hotReloadMapDatabase()" title="Reload maps.js dataset without resetting your page zoom">↻ Reload Data</button>
            <!-- Copies a link that reopens this exact map, spot, and zoom for whoever you send it to -->
            <button id="shareLinkBtn" class="toggle-btn" title="Copy a link to this exact map view">🔗 Share View</button>
            <!-- Opens the right-side panel listing every quest on the current map, grouped by NPC -->
            <button id="questListBtn" class="toggle-btn" title="Show all quests on this map, grouped by NPC">📋 Quests</button>
            <!-- Opens a modal listing every NPC/Shop label on this map, with name/sex/race/level and summary stats -->
            <button id="statisticsBtn" class="toggle-btn" title="Show NPC/Shop statistics for this map">📊 Statistics</button>

            <!-- Background music control - plays whatever track the current map's "music" field points to -->
            <div class="music-control">
                <button id="musicToggleBtn" class="toggle-btn" title="Mute background music">🔊</button>
                <input type="range" id="musicVolumeSlider" min="0" max="100" value="50" title="Music volume">
            </div>
            
            <span id="tool-status">✦ Click to place a label, or drag any pin to move it — drag empty space to pan</span>
            
            <!-- Splitting coordinates into rigid individual text containers inside the menu bar -->
            <div id="map-coordinates-hud">
                <div id="hud-box-w" class="coord-box"><span id="hud-val-w" class="coord-val">0</span><span class="coord-lbl">W</span></div>
                <div id="hud-box-s" class="coord-box"><span id="hud-val-s" class="coord-val">0</span><span class="coord-lbl">S</span></div>
                <div id="hud-box-zoom" class="coord-box" style="display:none;"><span id="hud-val-zoom" class="coord-val">100%</span><span class="coord-lbl">Zoom</span></div>
            </div>
        </div>
        
        <div id="viewport">
            <div id="pan-container">
                <img id="zoomImage" src="" alt="" style="display: none;">
                <!-- Map labels and structural info popups inject dynamically here -->
            </div>

            <!-- Floating On-Screen Map Zoom Interface HUD Buttons -->
            <div id="zoom-controls">
                <button id="zoomInBtn" class="zoom-ctrl-btn" title="Zoom In">+</button>
                <button id="zoomOutBtn" class="zoom-ctrl-btn" title="Zoom Out">-</button>
            </div>

            <!-- Alternate-view toggle - only shown when the current map defines an "altView" -->
            <button id="altViewBtn" class="alt-view-btn" title="Show alternate view" style="display:none;">
                <img id="altViewIcon" src="" alt="Alternate view">
            </button>
        </div>
    </div>

    <!-- Right-side slide-out panel listing all quests on the current map, grouped by NPC -->
    <div id="quest-list-panel">
        <div class="quest-panel-header">
            <h3>Quests — <span id="quest-panel-mapname"></span></h3>
            <span id="quest-panel-close" class="quest-panel-close-btn">&times;</span>
        </div>
        <div id="quest-panel-content"></div>
    </div>

    <!-- Full-screen overlay for clickable inventory items (notes, books, etc.) - click anywhere to dismiss -->
    <div id="item-image-overlay">
        <img id="item-image-overlay-img" src="" alt="">
    </div>

    <!-- Modal overlay: NPC/Shop statistics table for the current map -->
    <div id="statistics-overlay">
        <div class="statistics-panel">
            <div class="statistics-header">
                <h3>Statistics — <span id="statistics-mapname"></span></h3>
                <span id="statistics-close" class="quest-panel-close-btn">&times;</span>
            </div>
            <div id="statistics-content"></div>
        </div>
    </div>

    <!-- Modal overlay: sortable table of every quest across a region - used on the World Map,
         where the usual NPC-grouped side panel has nothing of its own to group by -->
    <div id="quests-table-overlay">
        <div class="statistics-panel">
            <div class="statistics-header">
                <h3>Quests — <span id="quests-table-mapname"></span></h3>
                <span id="quests-table-close" class="quest-panel-close-btn">&times;</span>
            </div>
            <div id="quests-table-content"></div>
        </div>
    </div>

    <!-- Catches a maps-data syntax/parse error before it happens - must be registered
         before the data files load, since viewer.js (which reports it) loads after them -->
    <script>
        window.__mapsJsLoadErrors = [];
        window.__recordScriptError = function(message, source, line, column) {
            if (!source || !/\.js(?:$|\?)/i.test(source)) return;
            const shortName = source.split('/').pop().split('?')[0];
            const key = `${source}:${line || 0}:${column || 0}:${message || ''}`;
            if (window.__mapsJsLoadErrors.some(error => error.key === key)) return;
            const error = {
                key,
                file: shortName,
                message: message || 'The file could not be parsed.',
                line,
                column,
                source
            };
            window.__mapsJsLoadErrors.push(error);
            window.__showScriptError(error);
        };
        window.__showScriptError = function(error) {
            let panel = document.getElementById('script-error-panel');
            if (!panel) {
                panel = document.createElement('section');
                panel.id = 'script-error-panel';
                document.body.appendChild(panel);
            }

            panel.innerHTML = '';
            const title = document.createElement('h2');
            title.textContent = 'JavaScript file error';
            const file = document.createElement('strong');
            file.textContent = error.file || 'Unknown file';
            const message = document.createElement('div');
            message.className = 'script-error-message';
            message.textContent = error.message || 'The file could not be parsed.';
            const location = document.createElement('div');
            location.className = 'script-error-location';
            location.textContent = error.line ? `Line ${error.line}${error.column ? `, column ${error.column}` : ''}` : '';
            const source = document.createElement('pre');
            source.className = 'script-error-source';
            source.textContent = 'Loading source context...';
            panel.append(title, file, message, location, source);

            if (!error.source || !error.line) return;
            fetch(error.source).then(response => response.text()).then(text => {
                const lines = text.split(/\r?\n/);
                const start = Math.max(1, error.line - 3);
                const end = Math.min(lines.length, error.line);
                source.innerHTML = '';
                for (let number = start; number <= end; number++) {
                    const line = document.createElement('div');
                    line.className = number === error.line ? 'script-error-line-failed' : '';
                    line.textContent = `${String(number).padStart(String(end).length, ' ')} | ${lines[number - 1]}`;
                    source.appendChild(line);
                }
            }).catch(() => {
                source.textContent = 'Source context could not be loaded.';
            });
        };
        window.addEventListener('error', function(e) {
            window.__recordScriptError(e.message, e.filename, e.lineno, e.colno);
        });
        window.onerror = function(message, source, line, column) {
            window.__recordScriptError(message, source, line, column);
            return false;
        };
    </script>

    <!-- Load data asset manifests - one per mod-category tab -->
    <script src="arcanummaps.js"></script>
    <script src="cerestoredmaps.js"></script>
    <script src="modulesmaps.js"></script>
    <script src="items.js"></script>

    <!-- Load clean separated engine logic script file -->
    <script src="viewer.js"></script>
</body>
</html>
